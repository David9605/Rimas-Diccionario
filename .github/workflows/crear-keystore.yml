name: Crear llave de subida (keystore)

# Ejecútalo UNA sola vez, SOLO en un repositorio PRIVADO.
# Descarga el artefacto, guarda una copia segura y bórralo después.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - name: Generar keystore
        run: |
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v -keystore upload.jks -alias rimasdiccionario \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=David Gonzalez Esquerra, OU=Rimas Diccionario, O=Rimas Diccionario, C=VE"
          base64 -w0 upload.jks > upload.jks.b64
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=rimasdiccionario\n' "$PASS" "$PASS" > secretos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-NO-COMPARTIR
          path: |
            upload.jks
            upload.jks.b64
            secretos.txt
          retention-days: 1
