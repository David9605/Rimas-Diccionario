name: Compilar Rimas Diccionario

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generar lista de palabras desde RLA-ES (automático)
        run: |
          sudo apt-get update && sudo apt-get install -y hunspell-tools hunspell-es unzip
          bash tools/generar_palabras.sh 2.9 es_ANY || echo "::warning::No se pudo descargar RLA-ES; se usa la lista que ya está en el repositorio."

      - name: Aceptar licencias y plataforma Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Pruebas y APK de depuración
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rimas-diccionario-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Verificar que no se publique la lista de muestra
        if: env.KEYSTORE_B64 != ''
        run: |
          N=$(wc -l < app/src/main/assets/palabras.txt)
          echo "Palabras en la lista: $N"
          if [ "$N" -lt 50000 ]; then echo "::error::La lista de palabras es de muestra ($N). Revisa el paso de RLA-ES antes de publicar."; exit 1; fi

      - name: Preparar keystore (solo si hay secretos)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: APK + AAB de producción (firmados)
        if: env.KEYSTORE_B64 != ''
        run: gradle --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: rimas-diccionario-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Publicar en Releases (al subir una etiqueta vX.Y.Z)
        if: env.KEYSTORE_B64 != '' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # OPCIONAL: solo si configuraste PLAY_SERVICE_ACCOUNT_JSON y la app ya existe en Play Console.
      - name: Subir el AAB a Google Play (pista interna, borrador)
        if: env.PLAY_JSON != '' && env.KEYSTORE_B64 != '' && startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.davidgonzalez.rimasdiccionario
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
